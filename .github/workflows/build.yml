name: Build jars

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: forge-1.20.1
            java: "17"
            artifact: xiaozhi_tpa-1.0.0-forge-1.20.1.jar
          - project: forge-1.21.1
            java: "21"
            artifact: xiaozhi_tpa-1.0.0-forge-1.21.1.jar
          - project: neoforge-1.21.1
            java: "21"
            artifact: xiaozhi_tpa-1.0.0-neoforge-1.21.1.jar
          - project: fabric-1.20.1
            java: "17"
            artifact: xiaozhi_tpa-1.0.0-fabric-1.20.1.jar
          - project: fabric-1.21.1
            java: "21"
            artifact: xiaozhi_tpa-1.0.0-fabric-1.21.1.jar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle 8.x (ForgeGradle 6 / Loom / ModDevGradle need Gradle 8)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        working-directory: ${{ matrix.project }}
        run: gradle build --no-daemon

      - name: Collect jar
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          find "${{ matrix.project }}/build/libs" \
            -name 'xiaozhi_tpa-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' | head -n 1 \
            | xargs -I{} cp {} "artifact/${{ matrix.artifact }}"
          ls -la artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact/${{ matrix.artifact }}
          if-no-files-found: error

  # Create a GitHub Release when a v* tag is pushed, attaching all built jars.
  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xiaozhi_tpa-*.jar
          merge-multiple: true
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          generate_release_notes: true
