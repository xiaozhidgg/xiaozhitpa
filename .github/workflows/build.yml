name: Build jars

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: forge-1.20.1
            java: "17"
            artifact: xiaozhi_tpa-forge-1.20.1.jar
          - project: forge-1.21.1
            java: "21"
            artifact: xiaozhi_tpa-forge-1.21.1.jar
          - project: neoforge-1.21.1
            java: "21"
            artifact: xiaozhi_tpa-neoforge-1.21.1.jar
          - project: fabric-1.20.1
            java: "17"
            artifact: xiaozhi_tpa-fabric-1.20.1.jar
          - project: fabric-1.21.1
            java: "21"
            artifact: xiaozhi_tpa-fabric-1.21.1.jar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle 8.x (ForgeGradle 6 / Loom / ModDevGradle need Gradle 8)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        working-directory: ${{ matrix.project }}
        run: gradle build --no-daemon

      - name: Collect jar
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          find "${{ matrix.project }}/build/libs" \
            -name 'xiaozhi_tpa-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' | head -n 1 \
            | xargs -I{} cp {} "artifact/${{ matrix.artifact }}"
          ls -la artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact/${{ matrix.artifact }}
          if-no-files-found: error

  # Create a GitHub Release when a v* tag is pushed, attaching all built jars.
  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xiaozhi_tpa-*.jar
          merge-multiple: true
          path: artifacts

      - name: Rename jars with release version + write body (grouped by core)
        shell: bash
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          cd artifacts
          for f in xiaozhi_tpa-*.jar; do
            base="${f#xiaozhi_tpa-}"
            mv "$f" "xiaozhi_tpa-${VER}-${base}"
          done
          cd ..
          cat > body.md <<EOF
          # Xiaozhi TPA $GITHUB_REF_NAME

          服务端专用 TPA / 回家 / 返回 模组（Forge / NeoForge / Fabric）。客户端无需安装，放入对应加载器的服务端 \`mods/\` 即可，兼容原版客户端。

          **功能**：\`/tpa\` 传送请求（60 秒超时）、\`/tpauto\` 自动接受、按维度多座命名家、\`/back\` 返回死亡或传送前位置、数据存档持久化、支持**跨维度回家**。

          ## 🟠 Forge
          - \`xiaozhi_tpa-${VER}-forge-1.20.1.jar\` — Minecraft 1.20.1
          - \`xiaozhi_tpa-${VER}-forge-1.21.1.jar\` — Minecraft 1.21.1

          ## ⚡ NeoForge
          - \`xiaozhi_tpa-${VER}-neoforge-1.21.1.jar\` — Minecraft 1.21.1

          ## 🟢 Fabric
          - \`xiaozhi_tpa-${VER}-fabric-1.20.1.jar\` — Minecraft 1.20.1（需 Fabric API）
          - \`xiaozhi_tpa-${VER}-fabric-1.21.1.jar\` — Minecraft 1.21.1（需 Fabric API）

          > 命令：\`/tpa\` \`/tpaccept\` \`/tpdeny\` \`/tpauto\` \`/sethome\` \`/home\` \`/delhome\` \`/listhome\` \`/back\`。提示为内置中文。
          EOF
          ls -la artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          body_path: body.md
